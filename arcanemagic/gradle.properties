# ================================================================
# この内容は、実際に https://fabricmc.net/develop/template/ で
# Minecraft 26.2 を選んで生成したテンプレートの gradle.properties を
# 参考に更新したものです(2026年9月時点)。
#
# 実際に使うときは、必ず生成したテンプレート側の gradle.properties を
# 使ってください(バージョン番号は日々更新されるため、ここに書いた値は
# 参考値・過去の一例に過ぎません)。README.md の「手順1」を参照。
# ================================================================

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.0.0
group=com.arcanemagic

# Dependencies
fabric_api_version=0.160.0+26.2
