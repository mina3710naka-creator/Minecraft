# ================================================================
# 重要: この4つの値はサンドボックス環境がインターネットに接続できず
# 実際の最新値を取得できなかったため「暫定値」です。
# 必ず https://fabricmc.net/develop/template/ で
# ・Minecraft version: 26.2
# ・Loader / Fabric API / Yarn mappings: 表示されている最新版
# を選んでプロジェクトを生成し、そこで出てきた gradle.properties の
# 4つの値でこのファイルを上書きしてください。詳しくは README.md の
# 「手順1」を参照してください。
# ================================================================

# 実行環境設定
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric properties (要更新: 上記コメント参照)
minecraft_version=26.2
yarn_mappings=26.2+build.1
loader_version=0.16.10

# Mod properties
mod_version=1.0.0
maven_group=com.arcanemagic
archives_base_name=arcanemagic

# Dependencies (要更新: 上記コメント参照)
fabric_version=0.110.0+26.2
loom_version=1.9-SNAPSHOT
