name: Inspect API

# lampvideomod の jar を GitHub 上でビルドして、成果物(artifact)として保存する。
# 手動実行(Actions タブ > Build lampvideomod > Run workflow)では、Minecraft のバージョンを指定でき、
# できた jar を lampvideomod/dist/ にも保存する。lampvideomod を変更した push でも動く(確認だけ)。
on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraft のバージョン"
        default: "26.3"
  push:
    paths:
      - ".github/workflows/inspect-api.yml"

permissions:
  contents: write

env:
  MC: ${{ inputs.minecraft_version || '26.3' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lampvideomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      # 指定した Minecraft バージョンに合う Fabric API と Loader を、Fabric の配布元から探して gradle.properties に書く
      - name: Set versions for Minecraft ${{ env.MC }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          mc = os.environ["MC"]
          meta = urllib.request.urlopen(
              "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml").read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", meta) if v.endswith("+" + mc)]
          if not api:
              raise SystemExit(f"Fabric API for Minecraft {mc} was not found")
          values = {"minecraft_version": mc, "fabric_api_version": api[-1]}
          try:
              loaders = json.load(urllib.request.urlopen(f"https://meta.fabricmc.net/v2/versions/loader/{mc}"))
              stable = [l["loader"]["version"] for l in loaders if l["loader"].get("stable")]
              if stable:
                  values["loader_version"] = stable[0]
          except Exception as e:
              print("loader lookup failed, keeping the current loader_version:", e)
          text = open("gradle.properties", encoding="utf-8").read()
          for k, v in values.items():
              text = re.sub(rf"^{k}=.*$", f"{k}={v}", text, flags=re.M)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          print(values)
          PY
      - name: Build to fetch jars
        run: gradle build --no-daemon --console=plain -x test || true
      - name: javap
        run: |
          J=$(find ~/.gradle -name 'minecraft-merged-deobf-26.3.jar' | head -1)
          FAB=$(find ~/.gradle -name 'fabric-*.jar' | grep -v sources | tr '\n' ':')
          echo "##### SoundEvents"; javap -p -cp "$J" net.minecraft.sounds.SoundEvents | grep -E " (NOTE_BLOCK_[A-Z_]+|COW_AMBIENT|VILLAGER_AMBIENT|EXPERIENCE_ORB_PICKUP|AMETHYST_BLOCK_CHIME|STONE_PLACE|WOOD_HIT|UI_BUTTON_CLICK|GLASS_BREAK|BELL_BLOCK|ARROW_HIT|GENERIC_EXPLODE);" 
          echo "##### ClientLevel/Level playLocalSound"; javap -p -cp "$J" net.minecraft.client.multiplayer.ClientLevel | grep -i "playLocalSound"; javap -p -cp "$J" net.minecraft.world.level.Level | grep -E " clip\(|playLocalSound"
          echo "##### ClipContext"; javap -p -cp "$J" net.minecraft.world.level.ClipContext | grep -E "ClipContext\(|enum|class"
          echo "##### BlockHitResult"; javap -p -cp "$J" net.minecraft.world.phys.BlockHitResult | grep -E "public"
          echo "##### Creative screen"; javap -p -cp "$J" net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen | grep -E "class|selectTab|SlotWrapper|hovered|leftPos|renderTabButton|extract|CreativeModeTab selectedTab|Slot " | head -40
          unzip -l "$J" | grep -i "CreativeModeInventoryScreen" | awk '{print $4}'
          echo "##### SlotWrapper"; javap -p -cp "$J" 'net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen$SlotWrapper' | head -20
          echo "##### selectTab bytecode (slot positions)"; javap -p -c -cp "$J" net.minecraft.client.gui.screens.inventory.CreativeModeInventoryScreen | awk '/void selectTab\(/{f=1} f{print} /^$/{if(f)exit}' | grep -E "bipush|sipush|iconst|new |invokespecial|if_icmp|if[a-z]+ |imul|iadd|irem|idiv" | head -80
          echo "##### Fabric screen api"; javap -p -cp "$FAB" net.fabricmc.fabric.api.client.screen.v1.Screens | grep public; javap -p -cp "$FAB:$J" net.fabricmc.fabric.api.client.screen.v1.ScreenEvents | grep -E "public static"
          echo "##### AbstractWidget"; javap -p -cp "$J" net.minecraft.client.gui.components.AbstractWidget | grep -E "isHovered|visible|setX|setY|class"
          true
