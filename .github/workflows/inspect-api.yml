name: Inspect API

# lampvideomod の jar を GitHub 上でビルドして、成果物(artifact)として保存する。
# 手動実行(Actions タブ > Build lampvideomod > Run workflow)では、Minecraft のバージョンを指定でき、
# できた jar を lampvideomod/dist/ にも保存する。lampvideomod を変更した push でも動く(確認だけ)。
on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraft のバージョン"
        default: "26.3"
  push:
    paths:
      - ".github/workflows/inspect-api.yml"

permissions:
  contents: write

env:
  MC: ${{ inputs.minecraft_version || '26.3' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lampvideomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      # 指定した Minecraft バージョンに合う Fabric API と Loader を、Fabric の配布元から探して gradle.properties に書く
      - name: Set versions for Minecraft ${{ env.MC }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          mc = os.environ["MC"]
          meta = urllib.request.urlopen(
              "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml").read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", meta) if v.endswith("+" + mc)]
          if not api:
              raise SystemExit(f"Fabric API for Minecraft {mc} was not found")
          values = {"minecraft_version": mc, "fabric_api_version": api[-1]}
          try:
              loaders = json.load(urllib.request.urlopen(f"https://meta.fabricmc.net/v2/versions/loader/{mc}"))
              stable = [l["loader"]["version"] for l in loaders if l["loader"].get("stable")]
              if stable:
                  values["loader_version"] = stable[0]
          except Exception as e:
              print("loader lookup failed, keeping the current loader_version:", e)
          text = open("gradle.properties", encoding="utf-8").read()
          for k, v in values.items():
              text = re.sub(rf"^{k}=.*$", f"{k}={v}", text, flags=re.M)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          print(values)
          PY
      - name: Build to fetch jars
        run: gradle build --no-daemon --console=plain -x test || true
      - name: javap
        run: |
          J=$(find ~/.gradle -name 'minecraft-merged-deobf-26.3.jar' | head -1)
          F=$(find ~/.gradle -name 'fabric-object-builder-api*.jar' | grep -v sources | head -1)
          for c in net.minecraft.client.renderer.blockentity.BlockEntityRenderer net.minecraft.client.renderer.blockentity.BlockEntityRenderers net.minecraft.client.renderer.blockentity.state.BlockEntityRenderState net.minecraft.client.renderer.SubmitNodeCollector net.minecraft.client.renderer.rendertype.RenderTypes net.minecraft.client.renderer.rendertype.RenderType net.minecraft.client.renderer.texture.DynamicTexture net.minecraft.client.renderer.texture.TextureManager net.minecraft.world.level.block.entity.BlockEntity net.minecraft.world.level.block.EntityBlock net.minecraft.world.level.block.BaseEntityBlock net.fabricmc.fabric.api.object.builder.v1.block.entity.FabricBlockEntityTypeBuilder net.minecraft.world.level.block.entity.BlockEntityType com.mojang.blaze3d.platform.NativeImage net.minecraft.client.renderer.feature.CustomFeatureRenderer; do echo "##### $c"; javap -p -cp "$J:$F" $c 2>&1 | head -70; done
          echo "##### BlockEntityRenderers register sites"; javap -p -c -cp "$J" net.minecraft.client.renderer.blockentity.BlockEntityRenderers | grep -i "register\|Sign\|Chest" | head -12
          echo "##### Fabric renderer registry"; unzip -l "$F" | grep -i "BlockEntity" | head; for f in $(find ~/.gradle -name 'fabric-rendering*.jar' | grep -v sources | head -2); do unzip -l $f | grep -i "BlockEntityRenderer\|BlockEntityRendererRegistry"; done
          echo "##### MC texture/render type with custom texture"; javap -p -cp "$J" net.minecraft.client.renderer.rendertype.RenderTypes | grep -i "text\|entityCutout\|entitySolid\|beacon\|gui" | head -30
