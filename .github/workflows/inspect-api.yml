name: Inspect API

# lampvideomod の jar を GitHub 上でビルドして、成果物(artifact)として保存する。
# 手動実行(Actions タブ > Build lampvideomod > Run workflow)では、Minecraft のバージョンを指定でき、
# できた jar を lampvideomod/dist/ にも保存する。lampvideomod を変更した push でも動く(確認だけ)。
on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraft のバージョン"
        default: "26.3"
  push:
    paths:
      - ".github/workflows/inspect-api.yml"

permissions:
  contents: write

env:
  MC: ${{ inputs.minecraft_version || '26.3' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lampvideomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      # 指定した Minecraft バージョンに合う Fabric API と Loader を、Fabric の配布元から探して gradle.properties に書く
      - name: Set versions for Minecraft ${{ env.MC }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          mc = os.environ["MC"]
          meta = urllib.request.urlopen(
              "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml").read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", meta) if v.endswith("+" + mc)]
          if not api:
              raise SystemExit(f"Fabric API for Minecraft {mc} was not found")
          values = {"minecraft_version": mc, "fabric_api_version": api[-1]}
          try:
              loaders = json.load(urllib.request.urlopen(f"https://meta.fabricmc.net/v2/versions/loader/{mc}"))
              stable = [l["loader"]["version"] for l in loaders if l["loader"].get("stable")]
              if stable:
                  values["loader_version"] = stable[0]
          except Exception as e:
              print("loader lookup failed, keeping the current loader_version:", e)
          text = open("gradle.properties", encoding="utf-8").read()
          for k, v in values.items():
              text = re.sub(rf"^{k}=.*$", f"{k}={v}", text, flags=re.M)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          print(values)
          PY
      - name: Build to fetch jars
        run: gradle build --no-daemon --console=plain -x test || true
      - name: javap
        run: |
          J=$(find ~/.gradle -name 'minecraft-merged-deobf-26.3.jar' | head -1)
          show() { echo "##### $1 ($2)"; javap -p -cp "$J:$FAB" "$1" 2>&1 | grep -E "$2" | head -${3:-25}; }
          FAB=$(find ~/.gradle -name 'fabric-*.jar' | grep -v sources | tr '\n' ':')
          show net.minecraft.world.inventory.InventoryMenu "InventoryMenu\(|Slot|class|EquipmentSlot" 30
          show net.minecraft.world.inventory.AbstractContainerMenu "addSlot|slots;|class " 10
          show net.minecraft.world.inventory.Slot "Slot\(|mayPlace|class|container|index" 15
          show net.minecraft.client.gui.screens.Screen "isPauseScreen|shouldCloseOnEsc|keyPressed|class " 10
          show net.minecraft.client.gui.screens.inventory.InventoryScreen "class|render|Background|leftPos|topPos" 20
          show net.minecraft.world.entity.player.Player "getItemBySlot|setItemSlot|getInventory|canUseSlot|class " 10
          show net.minecraft.client.renderer.entity.layers.RenderLayer "class|submit|getParentModel" 10
          show net.minecraft.client.renderer.entity.player.AvatarRenderer "class|addLayer|extractRenderState|createRenderState" 10
          show net.minecraft.client.renderer.entity.state.AvatarRenderState "class" 5
          show net.minecraft.client.renderer.entity.state.HumanoidRenderState "class|head|Equipment" 20
          show net.minecraft.client.model.player.PlayerModel "class|head|body" 10
          show net.minecraft.client.model.geom.ModelPart "translateAndRotate|class" 5
          show net.minecraft.client.model.HumanoidModel "class|head" 6
          show net.minecraft.world.item.equipment.EquipmentAssets "ROOT_ID|class" 5
          show net.minecraft.world.item.equipment.Equippable\$Builder "setAsset|build|class|setSwappable" 10
          echo "##### fabric attachment api"; unzip -l $(find ~/.gradle -name 'fabric-data-attachment*.jar' | grep -v sources | head -1) | grep -i "attachment/v1" | awk '{print $4}' | head -20
          echo "##### fabric living entity layer"; for f in $(find ~/.gradle -name 'fabric-rendering-v1*.jar' | grep -v sources); do unzip -l $f | grep -i "LivingEntity\|RenderLayer\|FeatureRender" | awk '{print $4}'; done
          true
