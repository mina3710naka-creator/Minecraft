name: Inspect Upload

# チャンクの作り直しの対象の一覧を作る処理を確認する一時的なワークフロー。確認が終わったら削除する。
on:
  push:
    paths:
      - ".github/workflows/inspect-upload.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lampvideomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Set versions
        env:
          MC: "26.3"
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          mc = os.environ["MC"]
          meta = urllib.request.urlopen("https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml").read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", meta) if v.endswith("+" + mc)]
          values = {"minecraft_version": mc, "fabric_api_version": api[-1]}
          text = open("gradle.properties", encoding="utf-8").read()
          for k, v in values.items():
              text = re.sub(rf"^{k}=.*$", f"{k}={v}", text, flags=re.M)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          PY
      - name: Build (populate caches)
        run: gradle build --no-daemon --console=plain || true
      - name: Inspect
        run: |
          M=$(find ~/.gradle -path '*minecraftMaven*' -name 'minecraft-merged-deobf-26.3.jar' | head -1)
          C() { sed -E 's/net\/minecraft\/client\/renderer\/chunk\///g; s/net\/minecraft\/client\/renderer\///g; s/net\/minecraft\/core\///g; s/net\/minecraft\/client\///g; s/java\/util\/concurrent\///g; s/java\/util\///g; s/com\/mojang\/blaze3d\///g'; }
          echo "=== extract classes"; unzip -l "$M" | awk '{print $4}' | grep -E "renderer/extract/" | head -20
          echo "=== LevelExtractor members"; javap -p -cp "$M" net.minecraft.client.renderer.extract.LevelExtractor | C | grep -v lambda
          javap -p -c -cp "$M" net.minecraft.client.renderer.extract.LevelExtractor > /tmp/le.txt
          echo "=== references to sectionUpdateRenderStates"; grep -n "sectionUpdateRenderStates" /tmp/le.txt | head
          LN=$(grep -n "sectionUpdateRenderStates" /tmp/le.txt | head -1 | cut -d: -f1)
          START=$(awk -v ln="$LN" 'NR<=ln && /^  (public|private|protected|static).*\)/{s=NR} END{print s}' /tmp/le.txt)
          echo "--- method header"; sed -n "${START}p" /tmp/le.txt | C
          awk -v s="$START" 'NR>s{print} NR>s && /^$/{exit}' /tmp/le.txt | grep -E "invoke|getfield|putfield|ldc|bipush|sipush|iconst|icmp|if_|ifeq|ifne|ifge|ifgt|iflt|ifle|goto|new" | C | head -120
