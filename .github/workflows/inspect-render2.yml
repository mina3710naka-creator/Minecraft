name: Inspect Render 2

# チャンクの再構築まわりのクラスの中身を確認する一時的なワークフロー。確認が終わったら削除する。
on:
  push:
    paths:
      - ".github/workflows/inspect-render2.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lampvideomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Set versions
        env:
          MC: "26.3"
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          mc = os.environ["MC"]
          meta = urllib.request.urlopen("https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml").read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", meta) if v.endswith("+" + mc)]
          values = {"minecraft_version": mc, "fabric_api_version": api[-1]}
          text = open("gradle.properties", encoding="utf-8").read()
          for k, v in values.items():
              text = re.sub(rf"^{k}=.*$", f"{k}={v}", text, flags=re.M)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          PY
      - name: Build (populate caches)
        run: gradle build --no-daemon --console=plain || true
      - name: Members
        run: |
          M=$(find ~/.gradle -path '*minecraftMaven*' -name 'minecraft-merged-deobf-26.3.jar' | head -1)
          sed_clean() { sed -E 's/net\.minecraft\.client\.renderer\.chunk\.//g; s/net\.minecraft\.client\.renderer\.//g; s/net\.minecraft\.core\.//g; s/net\.minecraft\.client\.//g; s/java\.lang\.//g; s/java\.util\.//g'; }
          echo "=== RenderSection members"; javap -p -cp "$M" 'net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection' | sed_clean | grep -vE "lambda|^Compiled" 
          echo "=== RotatingSectionStorage"; javap -p -cp "$M" net.minecraft.client.RotatingSectionStorage | sed_clean
          echo "=== RotatingSectionStorage\$Value"; javap -p -cp "$M" 'net.minecraft.client.RotatingSectionStorage$Value' | sed_clean
          echo "=== ViewArea"; javap -p -cp "$M" net.minecraft.client.renderer.ViewArea | sed_clean
      - name: Bytecode
        run: |
          M=$(find ~/.gradle -path '*minecraftMaven*' -name 'minecraft-merged-deobf-26.3.jar' | head -1)
          sed_clean() { sed -E 's/net\/minecraft\/client\/renderer\/chunk\///g; s/net\/minecraft\/client\/renderer\///g; s/net\/minecraft\/core\///g; s/net\/minecraft\/client\///g'; }
          echo "=== LevelRenderer.compileSections"; javap -p -c -cp "$M" net.minecraft.client.renderer.LevelRenderer | awk '/private void compileSections/{f=1} f&&/^$/{exit} f' | grep -E "invoke|getfield|checkcast|instanceof|ldc|if|goto" | sed_clean | head -90
          echo "=== ClientLevel.setBlocksDirty"; javap -p -c -cp "$M" net.minecraft.client.multiplayer.ClientLevel | awk '/public void setBlocksDirty/{f=1} f&&/^$/{exit} f' | grep -E "invoke|getfield" | sed_clean | head -20
          echo "=== ClientLevel.setSectionDirtyWithNeighbors"; javap -p -c -cp "$M" net.minecraft.client.multiplayer.ClientLevel | awk '/public void setSectionDirtyWithNeighbors/{f=1} f&&/^$/{exit} f' | grep -E "invoke|getfield" | sed_clean | head -20
          echo "=== LevelRenderer methods"; javap -p -cp "$M" net.minecraft.client.renderer.LevelRenderer | grep -iE "void|boolean" | grep -iE "dirty|section|chunk|compile|block" | sed_clean | head -40
