name: Smoke test client

# クライアントを仮想ディスプレイで起動して、Mixin が適用されるかを確認する一時的なワークフロー。確認が終わったら削除する。
on:
  push:
    paths:
      - ".github/workflows/smoke-client.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lampvideomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Set versions
        env:
          MC: "26.3"
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          mc = os.environ["MC"]
          meta = urllib.request.urlopen("https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml").read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", meta) if v.endswith("+" + mc)]
          values = {"minecraft_version": mc, "fabric_api_version": api[-1]}
          text = open("gradle.properties", encoding="utf-8").read()
          for k, v in values.items():
              text = re.sub(rf"^{k}=.*$", f"{k}={v}", text, flags=re.M)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          PY
      - name: Make mixin failures loud (test only)
        run: |
          sed -i 's/"required": false/"required": true/; s/"defaultRequire": 0/"defaultRequire": 1/' src/main/resources/lampvideo.mixins.json
          sed -i "s/require = 0/require = 1/" src/main/java/com/lampvideo/mixin/LevelRendererMixin.java; grep -n "require" src/main/java/com/lampvideo/mixin/LevelRendererMixin.java
          cat src/main/resources/lampvideo.mixins.json
      - name: Install virtual display and Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libopengl0 mesa-vulkan-drivers libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 libasound2t64 || sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1
      - name: Run the client for a while
        run: |
          mkdir -p run
          (timeout 200 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon --console=plain > ../run-client.log 2>&1 || true)
          echo "exit done"
      - name: Show relevant log lines
        run: |
          echo "=== lampvideo / mixin lines (console)"
          grep -nEi "lampvideo|mixin|InvalidInjection|@ModifyConstant|compileSections" ../run-client.log | head -60
          echo "=== latest.log"
          if [ -f run/logs/latest.log ]; then grep -nEi "lampvideo|mixin|InvalidInjection|ModifyConstant|compileSections|Exception|ERROR" run/logs/latest.log | head -60; echo "--- tail"; tail -25 run/logs/latest.log; fi
          echo "=== console tail"; tail -40 ../run-client.log
