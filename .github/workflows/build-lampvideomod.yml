name: Build lampvideomod

# lampvideomod の jar を GitHub 上でビルドして、成果物(artifact)として保存する。
# 手動実行(Actions タブ > Build lampvideomod > Run workflow)でも、lampvideomod を変更した push でも動く。
on:
  workflow_dispatch:
  push:
    paths:
      - "lampvideomod/**"
      - "!lampvideomod/dist/**"
      - ".github/workflows/build-lampvideomod.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lampvideomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lampvideomod-jar
          path: lampvideomod/build/libs/*.jar
          if-no-files-found: error
      # 手動実行のときだけ、できた jar をリポジトリの lampvideomod/dist/ にも保存する(そのままダウンロードできるように)
      - name: Commit jar
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          mkdir -p lampvideomod/dist
          cp "$(ls lampvideomod/build/libs/*.jar | grep -v -- '-sources' | head -1)" lampvideomod/dist/lampvideomod.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lampvideomod/dist
          git commit -m "Update lampvideomod jar" || exit 0
          git push
