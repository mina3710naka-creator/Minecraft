name: Build lampvideomod

# lampvideomod の jar を GitHub 上でビルドして、成果物(artifact)として保存する。
# 手動実行(Actions タブ > Build lampvideomod > Run workflow)でも、lampvideomod を変更した push でも動く。
on:
  workflow_dispatch:
  push:
    paths:
      - "lampvideomod/**"
      - ".github/workflows/build-lampvideomod.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lampvideomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build --no-daemon --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: lampvideomod-jar
          path: lampvideomod/build/libs/*.jar
          if-no-files-found: error
