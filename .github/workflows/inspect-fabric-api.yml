name: Inspect Fabric API

# Fabric API / Minecraft の公開クラスを確認するための、一時的なワークフロー。確認が終わったら削除する。
on:
  push:
    paths:
      - ".github/workflows/inspect-fabric-api.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lampvideomod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Set versions
        env:
          MC: "26.3"
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          mc = os.environ["MC"]
          meta = urllib.request.urlopen("https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml").read().decode()
          api = [v for v in re.findall(r"<version>([^<]+)</version>", meta) if v.endswith("+" + mc)]
          values = {"minecraft_version": mc, "fabric_api_version": api[-1]}
          loaders = json.load(urllib.request.urlopen(f"https://meta.fabricmc.net/v2/versions/loader/{mc}"))
          values["loader_version"] = [l["loader"]["version"] for l in loaders if l["loader"].get("stable")][0]
          text = open("gradle.properties", encoding="utf-8").read()
          for k, v in values.items():
              text = re.sub(rf"^{k}=.*$", f"{k}={v}", text, flags=re.M)
          open("gradle.properties", "w", encoding="utf-8").write(text)
          print(values)
          PY
      - name: Build (to populate caches)
        run: gradle build --no-daemon || true
      - name: List API classes
        run: |
          for pat in fabric-resource-loader fabric-command-api; do
            for j in $(find ~/.gradle ~/.m2 -name "${pat}*.jar" ! -name '*sources*' 2>/dev/null | head -3); do
              echo "=== $j"
              unzip -l "$j" | awk '{print $4}' | grep -E '\.class$' | grep -vE '\$|mixin|impl' | head -60
            done
          done
      - name: javap key classes
        run: |
          J=$(find ~/.gradle -name 'fabric-resource-loader*.jar' ! -name '*sources*' | head -1)
          for c in net.fabricmc.fabric.api.resource.v1.ResourceLoader net.fabricmc.fabric.api.resource.v1.pack.PackActivationType net.fabricmc.fabric.api.resource.ResourceManagerHelper net.fabricmc.fabric.api.resource.ResourcePackActivationType; do
            echo "=== $c"; javap -public -cp "$J" "$c" 2>&1 | head -30
          done
          K=$(find ~/.gradle -name 'fabric-command-api-v2*.jar' ! -name '*sources*' | head -1)
          for c in net.fabricmc.fabric.api.client.command.v2.ClientCommandRegistrationCallback net.fabricmc.fabric.api.client.command.v2.ClientCommandManager net.fabricmc.fabric.api.client.command.v2.ClientCommands net.fabricmc.fabric.api.client.command.v2.FabricClientCommandSource; do
            echo "=== $c"; javap -public -cp "$K" "$c" 2>&1 | head -25
          done
      - name: javap Minecraft client classes
        run: |
          M=$(find ~/.gradle -path '*minecraftMaven*' -name '*.jar' ! -name '*sources*' | head -3)
          echo "$M"
          for j in $M; do
            for c in net.minecraft.client.Minecraft net.minecraft.server.packs.repository.PackRepository net.minecraft.client.Options; do
              javap -public -cp "$j" "$c" 2>/dev/null | grep -E "class |getResourcePackRepository|reloadResourcePacks|setSelected|getSelectedIds|getAvailableIds|updateResourcePacks|getInstance" | head -12
            done
          done
